<!doctype html>
<html>
<head>
  <title>EZ-Code Sandbox</title>
  <style>
    body {font-family:sans serif;max-width:700px;margin:0px auto;}
    #source {width:100%;height:400px;font-size:125%;border:1px solid #444;}
    #output {width:100%;border:1px solid #777;}
    .label {font-style:italic;font-weight:bold;color:#999;text-align:left;}
    .ace_keyword {font-weight:bold;}
    .ace-tm .ace_string {color: #f08;font-weight:bold;}
    .ace-tm .ace_constant.ace_numeric {color: #080;font-weight:bold;}
  </style>
</head>
<body>
<center>
<h1>EZ-Code Sandbox</h1>
<p>Small scripting language which translates (compiles, or "transpiles") to Perl, JS, PHP or Python.<br/>
<a href="https://github.com/rodiongork/ez-code">https://github.com/rodiongork/ez-code</a></p>
<div class="label">Source:</div>
<div id="source"></div>
<br/><br/>
<select id="lang">
<option value="pl">Perl</option>
<option value="js">JavaScript</option>
<option value="php">PHP</option>
<option value="py">Python</option>
</select>
<button id="translatebtn">Translate!</button>
or
<button id="runjs">Run (JS)</button>
<br/><br/>
<div class="label">Result:</div>
<textarea id="output" disabled="1" rows="20"></textarea>
<script src="./generated/ez-code.js"></script>
<script src="./web-assets/ace.js"></script>
<script src="./web-assets/common.js"></script>
</body>
</html>
